<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Логотип Дейлик">
  <!-- Дейлик: солнце с галочкой — «закрой задачи, поймай день» -->
  <defs>
    <linearGradient id="dl-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>

  <!-- Подложка: скруглённый квадрат с фирменным градиентом -->
  <rect width="64" height="64" rx="16" fill="url(#dl-sky)"/>

  <!-- Лучи солнца (8 шт., скруглённые окончания) -->
  <g stroke="#FFF7EE" stroke-width="3.5" stroke-linecap="round">
    <line x1="49.5" y1="32"   x2="54"   y2="32"/>
    <line x1="10"   y1="32"   x2="14.5" y2="32"/>
    <line x1="32"   y1="49.5" x2="32"   y2="54"/>
    <line x1="32"   y1="10"   x2="32"   y2="14.5"/>
    <line x1="44.4" y1="44.4" x2="47.6" y2="47.6"/>
    <line x1="16.4" y1="47.6" x2="19.6" y2="44.4"/>
    <line x1="16.4" y1="16.4" x2="19.6" y2="19.6"/>
    <line x1="44.4" y1="19.6" x2="47.6" y2="16.4"/>
  </g>

  <!-- Диск солнца -->
  <circle cx="32" cy="32" r="13" fill="#FFF7EE"/>

  <!-- Галочка — выполненная задача -->
  <path d="M25.5 32.5 L30 37 L39 26.5" fill="none" stroke="#FF6B35"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
